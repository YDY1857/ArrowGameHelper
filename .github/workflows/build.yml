name: Build ArrowGameHelper Tweak

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    # macOS Apple Silicon runner 上 Homebrew 的 fakeroot 与系统 arm64e 二进制
    # 不兼容（dyld 拒绝注入 libfakeroot.dylib），stage 阶段必挂。
    # Theos 官方支持 Linux 打包，fakeroot 原生可用，因此用 Ubuntu runner。
    runs-on: ubuntu-22.04
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip git libxml2 xz-utils
          # Theos 官方安装脚本在 Linux 上会切换到 fakeroot-sysv 后端
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Install ldid (not available in Ubuntu apt repos)
        run: |
          ARCH=$(uname -m)   # x86_64
          sudo curl -fsSL -o /usr/local/bin/ldid \
            "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_${ARCH}"
          sudo chmod +x /usr/local/bin/ldid
          ldid -v || true

      - name: Set up Theos
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          # 安装 iOS SDK（脚本从 theos/sdks 拉取最新可用版本）
          "$THEOS/bin/install-sdk" latest
          # 安装 Linux 版 iOS LLVM 工具链（与官方 install-theos 脚本一致）
          ARCH=$(uname -m)
          curl -sL "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${ARCH}.tar.xz" \
            | tar -xJ -C "$THEOS/toolchain/"
          # 验证关键工具就位
          ls "$THEOS/toolchain/linux/iphone/bin/clang"
          which ldid dpkg-deb fakeroot

      - name: Build & package (solver)
        run: make package FINALPACKAGE=1

      - name: Build & package (recon)
        run: cd recon && make package FINALPACKAGE=1

      - name: Verify dylibs have no substrate dependency
        run: |
          NM="$THEOS/toolchain/linux/iphone/bin/llvm-nm"
          DY=$(ls .theos/obj/*.dylib recon/.theos/obj/*.dylib 2>/dev/null || true)
          echo "Built dylibs: $DY"
          for f in $DY; do
            echo "== $f =="
            if "$NM" -u "$f" | grep -i -E "substrate|MSHook|logos" ; then
              echo "WARNING: substrate symbols found in $f (would fail without a jailbreak runtime)"
            else
              echo "OK: no substrate symbols in $f"
            fi
          done

      - name: Upload .deb + .dylib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ArrowGameHelper-${{ github.run_number }}
          path: |
            packages/*.deb
            recon/packages/*.deb
            .theos/obj/**/*.dylib
            recon/.theos/obj/**/*.dylib
          if-no-files-found: error

      - name: Attach to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            recon/packages/*.deb
